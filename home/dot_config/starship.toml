# Starship prompt config — managed by chezmoi.
# Edit the source with `chezmoi edit ~/.config/starship.toml`, then `chezmoi apply`.
# Docs: https://starship.rs/config/
# Preview after editing: `starship prompt` (or open a new shell).

"$schema" = "https://starship.rs/config-schema.json"

add_newline = true

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$golang\
$rust\
$java\
$lua\
$ruby\
$c\
$aws\
$cmd_duration\
$line_break\
$status\
$character"""

# ----------------------------------------------------------------------------
# User / host — only shown over SSH (devcontainers/remote boxes), hidden
# locally. No leading arrow: it's either the first thing on the line or
# absent entirely.
# ----------------------------------------------------------------------------
[username]
style_user = "bg:bright-black fg:white"
style_root = "bg:bright-black fg:red"
format = "[ $user ]($style)"
show_always = false

[hostname]
ssh_only = true
style = "bg:bright-black fg:white"
format = "[@$hostname ]($style)"
disabled = false

# ----------------------------------------------------------------------------
# Directory — always shown, the anchor the rest of the chain assumes comes
# right before it (so the arrow into git/etc. is always the right color).
# ----------------------------------------------------------------------------
[directory]
style = "bg:blue fg:black"
format = "[](fg:bright-black bg:blue)[ 󰉋 $path ]($style)"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "bg:blue fg:red"

# ----------------------------------------------------------------------------
# Git — branch + status share one green block. Only fires inside a repo, so
# it (and its leading arrow) simply disappears outside one.
# ----------------------------------------------------------------------------
[git_branch]
style = "bg:green fg:black"
format = "[](fg:blue bg:green)[  $branch ]($style)"

[git_status]
style = "bg:green fg:black"
format = "[($all_status$ahead_behind )]($style)"

# ----------------------------------------------------------------------------
# Language versions — one shared yellow block. Only the language modules
# actually relevant to the current directory render, mise-managed versions
# included. Each carries the same leading arrow so whichever one fires first
# still connects cleanly from the git segment.
# ----------------------------------------------------------------------------
[nodejs]
style = "bg:yellow fg:black"
format = "[](fg:green bg:yellow)[ $symbol$version ]($style)"

[python]
style = "bg:yellow fg:black"
format = "[](fg:green bg:yellow)[ $symbol$version ]($style)"

[golang]
style = "bg:yellow fg:black"
format = "[](fg:green bg:yellow)[ $symbol$version ]($style)"

[rust]
style = "bg:yellow fg:black"
format = "[](fg:green bg:yellow)[ $symbol$version ]($style)"

[java]
style = "bg:yellow fg:black"
format = "[](fg:green bg:yellow)[ $symbol$version ]($style)"

[lua]
style = "bg:yellow fg:black"
format = "[](fg:green bg:yellow)[ $symbol$version ]($style)"

[ruby]
style = "bg:yellow fg:black"
format = "[](fg:green bg:yellow)[ $symbol$version ]($style)"

[c]
style = "bg:yellow fg:black"
format = "[](fg:green bg:yellow)[ $symbol$version ]($style)"

# ----------------------------------------------------------------------------
# AWS profile + command duration — plain colored text rather than more
# powerline blocks. Both are occasional/orthogonal to the chain above (an
# AWS profile can be set with no language module active, and vice versa), so
# blocking them in would risk a mismatched arrow color; plain text sidesteps
# that entirely.
# ----------------------------------------------------------------------------
[aws]
symbol = " "
style = "bold red"
format = " [$symbol$profile]($style)"

[cmd_duration]
min_time = 2000
style = "bold yellow"
format = " [ took $duration]($style)"

# ----------------------------------------------------------------------------
# Line two — exit code (only on failure) then the prompt character.
# ----------------------------------------------------------------------------
[status]
disabled = false
symbol = "✖ "
style = "bold red"
format = "[$symbol$status]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
